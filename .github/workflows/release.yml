name: Release

# 正式发布：推送 v* 标签触发。
# 桌面：tauri build 签名构建 NSIS 安装包 → scripts/gen-latest-json.mjs 生成 latest.json
#       （notes 取自 docs/RELEASE-NOTES-v{x.y.z}.md，每版单独成文）→ gh release create/upload 发布。
#       latest.json 作为 Release 资产，恰为 updater endpoints 指向的地址。
# 安卓：侧载场景构建 debug 签名 APK 附到同一 Release（无签名密钥要求）；2026-09-18 起暂缓。
#
# 前置 secrets（见 docs/RELEASE.md）：
#   TAURI_SIGNING_PRIVATE_KEY           更新签名私钥（src-tauri/keys/heid.key 的内容）
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  私钥密码（无密码则留空字符串）

on:
  push:
    tags:
      - 'v*'

jobs:
  desktop-release:
    name: 桌面发布（签名安装包 + latest.json）
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装依赖
        run: npm ci

      # 2026-09-18 弃用 tauri-action（v1.3.0 发布时它在 Release 上传阶段
      # 稳定报「Error creating asset temp dir」，且草稿 Release 冲突时直接失败）。
      # 改为三段式：tauri build 签名构建 → 自制脚本生成 latest.json → softprops 上传
      # （softprops 即安卓任务所用组件，本仓库内长期验证可靠）。
      - name: 构建签名安装包
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: npx tauri build

      - name: 生成 latest.json
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          MINOR=${VERSION%.*}
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "MINOR=$MINOR" >> "$GITHUB_ENV"
          node scripts/gen-latest-json.mjs \
            --version "$VERSION" \
            --sig "src-tauri/target/release/bundle/nsis/H.I.D.E_${VERSION}_x64-setup.exe.sig" \
            --notes "docs/RELEASE-NOTES-v${VERSION}.md" \
            --url "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/H.I.D.E_${VERSION}_x64-setup.exe" \
            --out "src-tauri/target/release/bundle/nsis/latest.json"

      # 2026-09-18 弃用 tauri-action 与 softprops/action-gh-release 做资产上传：
      # 两者先后在 windows-latest 上稳定报「Error creating asset temp dir」
      # （softprops 在 ubuntu 上正常，桌面任务三连挂）。上传改用 runner 预装的 gh CLI。
      - name: 发布 Release（安装包 + 签名 + latest.json）
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
                 --title "H.I.D.E $TAG" \
                 --notes-file "docs/RELEASE-NOTES-v${VERSION}.md"
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            "src-tauri/target/release/bundle/nsis/H.I.D.E_${VERSION}_x64-setup.exe" \
            "src-tauri/target/release/bundle/nsis/H.I.D.E_${VERSION}_x64-setup.exe.sig" \
            "src-tauri/target/release/bundle/nsis/latest.json"
          # 兜底：草稿形态的 Release 对外不可见（softprops 等以草稿创建、中途失败
          # 就永远停在草稿态——v1.3.1 即如此）。gh CLI 直接创建已发布 Release，
          # 此处强制发布仅为防御未来变动。注意 Release 的 created_at 是标签所指
          # 提交的时间，排查问题时不要误读为草稿创建时刻。
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false

  android-release:
    # v1.4 起恢复发布，改用 release 签名 APK（密钥经 secrets 提供，见 docs/RELEASE.md 安卓签名节）
    # needs：Release 正文（= latest.json 的应用内更新说明）由桌面任务用 --notes-file 建立，
    # 并行时安卓若先跑完会自己创建一个「自动生成说明」正文的 Release，把正文占掉
    name: 安卓发布（签名侧载 APK）
    needs: desktop-release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 定位 Android NDK
        run: echo "ANDROID_NDK_HOME=$(ls -d "$ANDROID_HOME"/ndk/* | head -n1)" >> "$GITHUB_ENV"

      - name: 安装依赖
        run: npm ci

      - name: 校验并还原签名密钥
        env:
          HEID_ANDROID_KEYSTORE_B64: ${{ secrets.HEID_ANDROID_KEYSTORE_B64 }}
          HEID_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.HEID_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$HEID_ANDROID_KEYSTORE_B64" ] || [ -z "$HEID_ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "::error::缺少仓库 secrets：HEID_ANDROID_KEYSTORE_B64 / HEID_ANDROID_KEYSTORE_PASSWORD。生成与导出步骤见 docs/RELEASE.md「安卓 release 签名」。"
            exit 1
          fi
          echo "$HEID_ANDROID_KEYSTORE_B64" | base64 -d > src-tauri/gen/android/app/heid-release.keystore
          cat > src-tauri/gen/android/keystore.properties <<EOF
          storeFile=app/heid-release.keystore
          storePassword=$HEID_ANDROID_KEYSTORE_PASSWORD
          keyAlias=heid
          keyPassword=$HEID_ANDROID_KEYSTORE_PASSWORD
          EOF

      - name: tauri android build（arm64 release APK，签名）
        run: npx tauri android build --apk --target aarch64

      # 产物名带版本与 ABI：gradle 输出的 app-universal-release.apk 在 --target aarch64 下
      # 其实只含 arm64 库，名字里的 universal 会误导下载者
      - name: 附到 Release（重命名为 H.I.D.E_<版本>_arm64.apk）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          SRC=$(ls src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk | head -n1)
          APK="H.I.D.E_${VERSION}_arm64.apk"
          cp "$SRC" "$APK"
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/' || { echo "::error::APK 内无 arm64 库，检查 --target 构建"; exit 1; }
          # gh release upload：只往已存在的 Release 追加资产（Release 由桌面任务建立）
          gh release upload "${{ github.ref_name }}" --repo "$GITHUB_REPOSITORY" --clobber "$APK"
