name: Release

# 正式发布：推送 v* 标签触发。
# 桌面：tauri-action 构建带更新签名的 NSIS 安装包 + latest.json，自动发布 GitHub Release
#       （latest.json 作为 Release 资产，恰为 updater endpoints 指向的地址）。
# 安卓：侧载场景构建 debug 签名 APK 附到同一 Release（无签名密钥要求）。
#
# 前置 secrets（见 docs/RELEASE.md）：
#   TAURI_SIGNING_PRIVATE_KEY           更新签名私钥（src-tauri/keys/heid.key 的内容）
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  私钥密码（无密码则留空字符串）

on:
  push:
    tags:
      - 'v*'

jobs:
  desktop-release:
    name: 桌面发布（签名安装包 + latest.json）
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装依赖
        run: npm ci

      - name: 构建并发布 Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'H.I.D.E ${{ github.ref_name }}'
          # releaseBody 会随 latest.json 的 notes 字段下发，成为应用内「更新说明」文档与通知卡片摘要；
          # 每次发版前更新为当版摘要（完整版见仓库 docs/RELEASE-NOTES-v*.md）。
          releaseBody: |
            ## v1.3.0 更新说明

            **结构化内容与新格式**：JSON / YAML 结构树与分屏视图（同步滚动）；Markdown 大纲导航浮窗、粘贴图片自动落盘、图片本地化、导出 HTML 代码高亮；CSV 只读态排序与筛选；打印 / 导出 PDF（`Ctrl+P`）。

            **标签拖拽与多窗口**（桌面）：标签栏内拖拽重排，拖出脱离成新窗口，跨窗口拖入合并，重启按窗口还原会话。

            **SVG 可视化编辑**：画布点选 / 拖拽移动 / 方向键微调，属性 / 图层 / 调色板检查面板，一键全局换色，PNG 导出；修改手术式写回源码（注释与缩进逐字保留）。

            **更多改进**：文件树自动刷新（外部变更实时反映）；跨文件搜索提速与 CJK 命中窗口修正；会话恢复并行读盘；更新检查改每次启动必检，更新说明支持应用内回看历史版本。

            完整说明见 [docs/RELEASE-NOTES-v1.3.md](https://github.com/misakimiku2/H.E.I.D-Editor/blob/main/docs/RELEASE-NOTES-v1.3.md)。
          releaseDraft: false
          prerelease: false

  android-release:
    name: 安卓发布（侧载 APK）
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 定位 Android NDK
        run: echo "ANDROID_NDK_HOME=$(ls -d "$ANDROID_HOME"/ndk/* | head -n1)" >> "$GITHUB_ENV"

      - name: 安装依赖
        run: npm ci

      - name: tauri android build（arm64 debug APK）
        run: npx tauri android build --debug --apk --target aarch64

      - name: 附到 Release
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/gen/android/app/build/outputs/apk/universal/debug/*.apk
