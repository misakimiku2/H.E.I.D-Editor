[package]
name = "nexus-editor"
version = "1.6.3"
description = "H.I.D.E (Highlighting Intelligent Document Editor) - lightweight text/code editor built with Tauri 2"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "nexus_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-fs = { version = "2", features = ["watch"] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
encoding_rs = "0.8"
ureq = "2"
# 设备互联（v1.5）：X25519 协商 + HKDF + ChaCha20-Poly1305。
# 声明为直接依赖**不新增编译产物** —— ring 0.17.14 已随 ureq → rustls 0.23 在树里
# （实测 Cargo.lock，且 aws-lc 零命中，rustls 用的就是 ring 后端），桌面与安卓都编进了包。
ring = "0.17"
# 图片本地化：二进制下载内容经 base64 回传前端
base64 = "0.22"
# 大文档 Markdown 检索/极速预览（纯 Rust，安卓可用）。
# 不用 comrak：解析偏移逐事件给出，配合文本投影即可建源码映射，速度也更快。
# Phase 2 需要 HTML 渲染器；只开 html，不引入 CLI（getopts）以减小包体。
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
# 极速预览的 HTML 清洗（allowlist）：4.0.x 的 MSRV 1.60，不抬高项目 rust-version
ammonia = ">=4.0, <4.1"

# 桌面专属插件：单实例聚焦 / 自动更新（安卓按侧载场景走前端版本检查，不引入原生更新器）
# 窗口状态记忆：主窗口位置/尺寸/最大化跨重启保留（纯原生侧自动保存恢复，前端无需调用）
# regex / rayon 仅供桌面跨文件搜索（安卓 SAF 无递归枚举能力，不编译进 APK）
[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-window-state = "2"
regex = "1"
rayon = "1"
# 阶段 4 的桌面文件变更监听。**声明为直接依赖不新增编译产物** ——
# notify 8.2.0 已随 tauri-plugin-fs（features= ["watch"]）在树里（实测 Cargo.lock），
# 桌面侧本来就在跑同一个后端（`watchImmediate` 就是它的 RecommendedWatcher 递归监听）。
notify = "8"

[dev-dependencies]
notify-debouncer-full = "0.6"

[profile.release]
codegen-units = 1
lto = true
strip = true
