<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- 浅色背景 -->
  <rect width="512" height="512" rx="112" fill="#F8FAFC" />

  <!-- 顶部栏 -->
  <path d="M 0 112 Q 0 0 112 0 L 400 0 Q 512 0 512 112 L 512 80 L 0 80 Z" fill="#E2E8F0" />

  <!-- 窗口控制点 -->
  <circle cx="64" cy="40" r="12" fill="#EF4444" />
  <circle cx="104" cy="40" r="12" fill="#F59E0B" />
  <circle cx="144" cy="40" r="12" fill="#10B981" />

  <!-- 终端提示符 >_< -->
  <!-- 大于号 > -->
  <path d="M 120 240 L 190 280 L 120 320" stroke="#0F172A" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- 下划线 _ -->
  <line x1="230" y1="310" x2="290" y2="310" stroke="#0F172A" stroke-width="24" stroke-linecap="round" />

  <!-- 小于号 < -->
  <path d="M 390 240 L 320 280 L 390 320" stroke="#0F172A" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" fill="none" />
</svg>