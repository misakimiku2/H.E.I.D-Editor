[package]
name = "nexus-editor"
version = "1.0.0"
description = "Nexus Editor - a standalone code editor extracted from nexus-ai-assistant"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "nexus_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
codegen-units = 1
lto = true
strip = true
